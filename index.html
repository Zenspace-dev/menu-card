<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Treat Street Truck - Menu Card</h1>

    <form id="menu-form">
        <label for="menu-input">Paste your menu as JSON</label>
        <textarea id="menu-input">
        [
        {"name": "Smash burger", "price": 6.5},
        {"name": "Funnel cake", "price": 5.5},
        {"name": "Deep-fried honey bun", "price": 6.25},
        {"name": "Hot pretzel", "price": 3}
        ]
        </textarea>
        <button type="submit">Show My Menu</button>
        </form>

        <p id="count"></p>
        <p id="menu-text"></p>
        <p id="special"></p>
   
    
    <script src="script.js"></script>
</body>
</html>
